name: Build MyTelegram iOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-26

    steps:
      # ============================================================
      # 1. Checkout 主仓库
      # ============================================================
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      # ============================================================
      # 2. 修复 fork 中的 submodule URL，然后手动初始化
      # ============================================================
      - name: Fix submodule URLs
        shell: bash
        run: |
          set -e

          echo "=== Original .gitmodules ==="
          cat .gitmodules

          echo
          echo "=== Fixing relative submodule URLs ==="

          git config -f .gitmodules \
            submodule.submodules/rlottie/rlottie.url \
            https://github.com/TelegramMessenger/rlottie.git

          git config -f .gitmodules \
            submodule.submodules/TgVoipWebrtc/tgcalls.url \
            https://github.com/TelegramMessenger/tgcalls.git

          echo
          echo "=== Fixed .gitmodules ==="
          cat .gitmodules

          echo
          echo "=== Syncing submodules ==="
          git submodule sync --recursive

          echo
          echo "=== Initializing submodules ==="
          git submodule update --init --recursive

          echo
          echo "=== Submodule status ==="
          git submodule status --recursive

      # ============================================================
      # 3. Select Xcode
      # ============================================================
      - name: Select Xcode 26.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.4"

      # ============================================================
      # 4. Show build environment
      # ============================================================
      - name: Show build environment
        shell: bash
        run: |
          set -e

          echo "=============================="
          echo "Xcode"
          echo "=============================="
          xcodebuild -version

          echo
          echo "=============================="
          echo "macOS"
          echo "=============================="
          sw_vers

          echo
          echo "=============================="
          echo "Xcode path"
          echo "=============================="
          xcode-select -p

          echo
          echo "=============================="
          echo "iPhoneOS SDK"
          echo "=============================="
          xcrun --sdk iphoneos --show-sdk-version

          echo
          echo "=============================="
          echo "Python"
          echo "=============================="
          python3 --version

      # ============================================================
      # 5. Verify MyTelegram server IP
      # ============================================================
      - name: Verify MyTelegram server IP
        shell: bash
        run: |
          set -e

          FILE="submodules/TelegramCore/Sources/Network/Network.swift"

          echo "Checking:"
          echo "$FILE"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: $FILE not found."
            exit 1
          fi

          if grep -q "45.196.236.46" "$FILE"; then
            echo
            echo "MyTelegram server IP found:"
            grep -n "45.196.236.46" "$FILE"
          else
            echo
            echo "ERROR: MyTelegram server IP was not found."
            exit 1
          fi

      # ============================================================
      # 6. Create build configuration
      #
      # 只修改 API ID / API Hash。
      #
      # 不修改 bundle_id / team_id。
      #
      # 使用项目自带 fake-codesigning。
      # 后面生成 IPA 后再用全能签重新签名。
      # ============================================================
      - name: Create build configuration
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        shell: bash
        run: |
          set -e

          if [ -z "$TG_API_ID" ]; then
            echo "ERROR: TG_API_ID is empty."
            exit 1
          fi

          if [ -z "$TG_API_HASH" ]; then
            echo "ERROR: TG_API_HASH is empty."
            exit 1
          fi

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          source = Path("build-system/appstore-configuration.json")
          destination = Path("build-configuration.json")

          if not source.exists():
              raise SystemExit(
                  f"Configuration file not found: {source}"
              )

          with source.open("r", encoding="utf-8") as f:
              config = json.load(f)

          api_id = os.environ["TG_API_ID"].strip()
          api_hash = os.environ["TG_API_HASH"].strip()

          try:
              config["api_id"] = int(api_id)
          except ValueError:
              raise SystemExit("TG_API_ID must be a number.")

          config["api_hash"] = api_hash

          with destination.open("w", encoding="utf-8") as f:
              json.dump(config, f, indent=2)
              f.write("\n")

          print("Build configuration created.")
          print()
          print("api_id:", config["api_id"])
          print("api_hash: configured")

          if "bundle_id" in config:
              print("bundle_id:", config["bundle_id"])

          if "team_id" in config:
              print("team_id:", config["team_id"])
          PY

      # ============================================================
      # 7. Fix BuildConfigExtra deprecated APIs
      #
      # Xcode 26 SDK 下：
      #
      #   NXGetArchInfoFromCpuType
      #   NXArchInfo
      #
      # 会产生 deprecated warning。
      #
      # 项目启用了 -Werror，
      # 所以 warning 会变成编译错误。
      #
      # 这里只针对 BuildConfigExtra.m 忽略 deprecated warning。
      # ============================================================
      - name: Fix BuildConfigExtra deprecated warnings
        shell: bash
        run: |
          set -e

          FILE="submodules/BuildConfigExtra/Sources/BuildConfigExtra.m"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: $FILE not found."
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "submodules/BuildConfigExtra/Sources/BuildConfigExtra.m"
          )

          text = path.read_text(encoding="utf-8")

          pragma = (
              '#pragma clang diagnostic ignored '
              '"-Wdeprecated-declarations"'
          )

          if pragma not in text:
              text = pragma + "\n\n" + text
              path.write_text(text, encoding="utf-8")
              print("Added deprecated-warning suppression.")
          else:
              print("Deprecated-warning suppression already exists.")
          PY

          echo
          echo "=== BuildConfigExtra.m header ==="
          head -n 12 "$FILE"

      # ============================================================
      # 8. Verify iPhone + iPad targets
      # ============================================================
      - name: Verify iPhone and iPad targets
        shell: bash
        run: |
          set -e

          echo "Checking Telegram/BUILD for iPhone/iPad families..."

          if grep -q '"iphone"' Telegram/BUILD; then
            echo "iPhone target: found"
          else
            echo "WARNING: iPhone target not found"
          fi

          if grep -q '"ipad"' Telegram/BUILD; then
            echo "iPad target: found"
          else
            echo "WARNING: iPad target not found"
          fi

      # ============================================================
      # 9. Prepare fake codesigning data
      # ============================================================
      - name: Prepare fake codesigning data
        shell: bash
        run: |
          set -e

          rm -rf build-codesigning
          mkdir -p build-codesigning

          cp -R build-system/fake-codesigning/. build-codesigning/

          echo
          echo "=============================="
          echo "Fake codesigning directory"
          echo "=============================="

          find build-codesigning \
            -maxdepth 3 \
            -type f \
            -print \
            | sort

          echo
          echo "=============================="
          echo "Provisioning profiles"
          echo "=============================="

          if [ ! -d "build-codesigning/profiles" ]; then
            echo "ERROR: build-codesigning/profiles not found."
            exit 1
          fi

          PROFILE_COUNT=$(find build-codesigning/profiles \
            -maxdepth 1 \
            -type f \
            -name "*.mobileprovision" \
            | wc -l | tr -d ' ')

          echo "Provisioning profile count: $PROFILE_COUNT"

          if [ "$PROFILE_COUNT" -eq 0 ]; then
            echo "ERROR: No fake provisioning profiles found."
            exit 1
          fi

          find build-codesigning/profiles \
            -maxdepth 1 \
            -type f \
            -name "*.mobileprovision" \
            -print \
            | sort

          echo
          echo "=============================="
          echo "Certificates"
          echo "=============================="

          if [ ! -d "build-codesigning/certs" ]; then
            echo "ERROR: build-codesigning/certs not found."
            exit 1
          fi

          find build-codesigning/certs \
            -maxdepth 1 \
            -type f \
            -print \
            | sort

          echo
          echo "=============================="
          echo "Import fake certificates"
          echo "=============================="

          if [ ! -f "build-codesigning/certs/SelfSigned.p12" ]; then
            echo "ERROR: SelfSigned.p12 not found."
            exit 1
          fi

          if [ ! -f "build-system/Make/ImportCertificates.py" ]; then
            echo "ERROR: ImportCertificates.py not found."
            exit 1
          fi

          python3 build-system/Make/ImportCertificates.py \
            --path "$PWD/build-codesigning/certs"

          echo
          echo "=============================="
          echo "Available signing identities"
          echo "=============================="

          security find-identity \
            -v \
            -p codesigning

      # ============================================================
      # 10. Build ARM64 IPA
      #
      # 关键：
      #
      # --outputBuildArtifactsPath
      #
      # 让 Make.py 主动把最终构建产物收集到：
      #
      # build/artifacts/
      #
      # 不再依赖手动猜测 Bazel 输出路径。
      # ============================================================
      - name: Build ARM64 IPA
        shell: bash
        run: |
          set -e

          rm -rf build/artifacts
          mkdir -p build/artifacts

          echo "=============================="
          echo "Starting ARM64 build"
          echo "=============================="

          python3 -u build-system/Make/Make.py \
            --cacheDir="$HOME/telegram-bazel-cache" \
            --overrideXcodeVersion \
            build \
            --configurationPath="$PWD/build-configuration.json" \
            --codesigningInformationPath="$PWD/build-codesigning" \
            --buildNumber="${{ github.run_number }}" \
            --configuration=release_arm64 \
            --outputBuildArtifactsPath="$PWD/build/artifacts"

          echo
          echo "=============================="
          echo "Make.py finished successfully"
          echo "=============================="

          echo
          echo "=============================="
          echo "Build artifacts"
          echo "=============================="

          if [ ! -d "build/artifacts" ]; then
            echo "ERROR: build/artifacts directory was not created."
            exit 1
          fi

          find build/artifacts \
            -maxdepth 3 \
            -print \
            | sort

      # ============================================================
      # 11. Verify generated IPA
      #
      # Make.py 已经通过 --outputBuildArtifactsPath
      # 将构建产物收集到 build/artifacts。
      #
      # 正常情况下这里应该存在 Telegram.ipa。
      # ============================================================
      - name: Verify generated IPA
        shell: bash
        run: |
          set -e

          echo "=============================="
          echo "Build artifacts"
          echo "=============================="

          find build/artifacts \
            -maxdepth 3 \
            -print \
            | sort

          echo
          echo "=============================="
          echo "Searching for IPA"
          echo "=============================="

          IPA_FILES=$(find build/artifacts \
            -type f \
            -name "*.ipa" \
            -print \
            | sort)

          if [ -z "$IPA_FILES" ]; then
            echo
            echo "ERROR: Telegram IPA was not generated."
            echo
            echo "Contents of build/artifacts:"
            find build/artifacts \
              -maxdepth 5 \
              -print \
              | sort

            exit 1
          fi

          echo "$IPA_FILES"

          IPA=$(echo "$IPA_FILES" | head -n 1)

          echo
          echo "=============================="
          echo "Selected IPA"
          echo "=============================="

          echo "$IPA"

          echo
          echo "=============================="
          echo "IPA details"
          echo "=============================="

          ls -lh "$IPA"
          file "$IPA"

          echo
          echo "=============================="
          echo "Preparing final artifacts"
          echo "=============================="

          rm -rf final-artifacts
          mkdir -p final-artifacts

          cp \
            "$IPA" \
            final-artifacts/MyTelegram-iOS-arm64.ipa

          echo
          echo "Final IPA:"
          ls -lh final-artifacts/MyTelegram-iOS-arm64.ipa

      # ============================================================
      # 12. Collect optional dSYM
      # ============================================================
      - name: Collect dSYM
        shell: bash
        run: |
          set -e

          if [ -f "build/artifacts/Telegram.DSYMs.zip" ]; then
            cp \
              build/artifacts/Telegram.DSYMs.zip \
              final-artifacts/MyTelegram-iOS.DSYMs.zip

            echo "Found dSYM:"
            ls -lh final-artifacts/MyTelegram-iOS.DSYMs.zip
          else
            echo "No build/artifacts/Telegram.DSYMs.zip found."
            echo "Skipping dSYM."
          fi

          echo
          echo "=============================="
          echo "Final artifacts"
          echo "=============================="

          ls -lh final-artifacts/

      # ============================================================
      # 13. Upload GitHub Actions artifacts
      # ============================================================
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MyTelegram-iOS-arm64
          path: final-artifacts/
          retention-days: 14
